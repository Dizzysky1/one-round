# ONE ROUND — multiplayer + shared leaderboard backend
#
# Bindings:
#   LEADERBOARD — KV namespace holding the shared board + naive rate limits
#   DUEL_ROOM   — Durable Object class for 1v1 duels (WebSocket hibernation)
#
# No secrets are required by this Worker; nothing here is sensitive.

name = "one-round-net"
main = "worker.js"
compatibility_date = "2026-06-01"

# Created with: npx wrangler kv namespace create LEADERBOARD
# (`wrangler dev` simulates KV locally, so no preview_id is needed.)
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "94712fc6195042a9a251b64f03d846ba"

[durable_objects]
bindings = [
  { name = "DUEL_ROOM", class_name = "DuelRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelRoom"]

# Optional: serve under a custom route instead of the workers.dev subdomain.
# [routes]
# pattern = "oneround-api.example.com/*"
# zone_name = "example.com"
